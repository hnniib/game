<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkUp - Sokoban Grammar Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #f1f5f9;
      color: #1e293b;
      font-family: 'Nunito', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    #game-container {
      width: 100%;
      max-width: 640px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(124, 58, 237, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* Top Navigasi LinkUp */
    #top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-family: 'Fredoka One', cursive;
      font-size: 26px;
      color: #7c3aed;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav-exit {
      background: #f8fafc;
      color: #64748b;
      border: 2px solid #e2e8f0;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-nav-exit:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }

    /* Header Soal */
    #question-card {
      background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
      border: 2px solid #ddd6fe;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    #level-badge {
      display: inline-block;
      background: #7c3aed;
      color: #ffffff;
      font-family: 'Fredoka One', cursive;
      font-size: 13px;
      padding: 4px 16px;
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);
    }

    #question-text {
      font-size: 18px;
      font-weight: 800;
      color: #4c1d95;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    #instruction-sub {
      font-size: 13px;
      color: #6d28d9;
      font-weight: 700;
    }

    /* Arena Canvas */
    #canvas-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8fafc;
      border-radius: 16px;
      border: 2px solid #e2e8f0;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Panel Kontrol */
    #controls-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    #hud-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: #ffffff;
      color: #475569;
      border: 2px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    /* Mobile D-Pad */
    #dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .dpad-row {
      display: flex;
      gap: 4px;
    }

    .dbtn {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      color: #7c3aed;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.1s ease;
    }

    .dbtn:active {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
    }

    /* === CUSTOM MODAL POPUP (Keren & Interaktif) === */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      width: 90%;
      max-width: 400px;
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.25);
      border: 2px solid #ddd6fe;
      transform: scale(0.85);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 52px;
      margin-bottom: 12px;
      display: inline-block;
      animation: bounceIcon 1s infinite alternate ease-in-out;
    }

    @keyframes bounceIcon {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .modal-title {
      font-family: 'Fredoka One', cursive;
      font-size: 22px;
      color: #4c1d95;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 15px;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn-modal-primary {
      width: 100%;
      background: #7c3aed;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(124, 58, 237, 0.3);
      transition: all 0.2s ease;
    }

    .btn-modal-primary:hover {
      background: #6d28d9;
      transform: translateY(-2px);
    }

    .btn-modal-primary:active {
      transform: translateY(0);
    }
  </style>
</head>

        modalBtn.innerText = btnText || 'Mengerti';

      // Sound Engine (Web Audio API)
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'move') {
          osc.frequency.setValueAtTime(240, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
          osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        } else if (type === 'push') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'bounce') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
          osc.start(); osc.stop(audioCtx.currentTime + 0.22);
        } else if (type === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
          osc.start(); osc.stop(audioCtx.currentTime + 0.45);
        }

        crates = JSON.parse(JSON.stringify(lvlData.crates));
        history = [];

        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (map[r][c] === 3) {
              player = { x: c, y: r };
              map[r][c] = 0;
            }
          }
        }
        draw();
      }

      // Visual Engine (High Quality Graphics)
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Render Tembok & Lantai Dungeon (Theme LinkUp Purple)
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const x = c * TILE_SIZE;
            const y = r * TILE_SIZE;

            if (map[r][c] === 1) {
              // Tembok Batu Slate Ungu
              ctx.fillStyle = '#6d28d9';
              ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
              
              // Tekstur Garis Bata Tembok
              ctx.strokeStyle = '#5b21b6';
              ctx.lineWidth = 2;
              ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);

              ctx.fillStyle = '#7c3aed';
              ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, 4);
            } else if (map[r][c] === 2) {
              // Lubang EXIT (Portal Sihir Hijau Zamrud)
              ctx.fillStyle = '#064e3b';
              ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
              
              ctx.strokeStyle = '#10b981';
              ctx.lineWidth = 3;
              ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);

              ctx.fillStyle = '#34d399';
              ctx.font = '900 13px Nunito';
              ctx.textAlign = 'center';
              ctx.fillText('EXIT 🚪', x + TILE_SIZE / 2, y + TILE_SIZE / 2 + 5);
            } else {
              // Lantai Lavender Bersih
              ctx.fillStyle = '#f5f3ff';
              ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
              
              ctx.strokeStyle = '#ede9fe';
              ctx.lineWidth = 1;
              ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
            }
          }
        }

        // 2. Render Kotak Jawaban (Orange 3D Crate)
        crates.forEach(crate => {
          const cx = crate.x * TILE_SIZE;
          const cy = crate.y * TILE_SIZE;

          // Bayangan Kotak
          ctx.fillStyle = 'rgba(0,0,0,0.1)';
          ctx.fillRect(cx + 6, cy + 8, TILE_SIZE - 8, TILE_SIZE - 8);

          // Badan Utama Kotak
          ctx.fillStyle = '#f97316';
          ctx.fillRect(cx + 4, cy + 4, TILE_SIZE - 8, TILE_SIZE - 8);
          
          ctx.strokeStyle = '#c2410c';
          ctx.lineWidth = 3;
          ctx.strokeRect(cx + 4, cy + 4, TILE_SIZE - 8, TILE_SIZE - 8);

          // Silang Kayu (X Brace)
          ctx.beginPath();
          ctx.moveTo(cx + 8, cy + 8);
          ctx.lineTo(cx + TILE_SIZE - 8, cy + TILE_SIZE - 8);
          ctx.moveTo(cx + TILE_SIZE - 8, cy + 8);
          ctx.lineTo(cx + 8, cy + TILE_SIZE - 8);
          ctx.strokeStyle = '#ea580c';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Label Teks Kata Jawaban
          ctx.fillStyle = '#ffffff';
          ctx.font = '800 11px Nunito';
          ctx.textAlign = 'center';
          ctx.fillText(crate.text, cx + TILE_SIZE / 2, cy + TILE_SIZE / 2 + 4, TILE_SIZE - 12);
        });

        // 3. Render Karakter Knight
        const px = player.x * TILE_SIZE;
        const py = player.y * TILE_SIZE;

        // Badan Utama (Lingkaran Armor Ungu)
        ctx.fillStyle = '#7c3aed';
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#4c1d95';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Mahkota / Bulu Merah
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(px + TILE_SIZE/2 - 4, py + 8, 8, 6);

        // Pelindung Mata Helm
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(px + TILE_SIZE/2 - 7, py + 22, 14, 4);
      }

      // Logika Pergerakan & Fisika Memantul
      function move(dx, dy) {
        const newX = player.x + dx;
        const newY = player.y + dy;

        if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) return;

        const crateIdx = crates.findIndex(c => c.x === newX && c.y === newY);

        if (crateIdx !== -1) {
          const crateNextX = newX + dx;
          const crateNextY = newY + dy;

          if (map[crateNextY][crateNextX] === 1) return;
          if (crates.some(c => c.x === crateNextX && c.y === crateNextY)) return;

          // Cek jika Kotak didorong ke Exit
          if (map[crateNextY][crateNextX] === 2) {
            const pushedCrate = crates[crateIdx];
            const currentLevel = levels[currentLevelIdx];

            if (pushedCrate.text === currentLevel.correct) {
              // Jawaban BENAR
              playSound('win');
              setTimeout(() => {
                if (currentLevelIdx + 1 < levels.length) {
                  openModal({
                    icon: '🎉',
                    title: 'Jawaban Benar!',
                    desc: `Luar biasa! Kotak "${pushedCrate.text}" tepat. Siap lanjut ke Level ${currentLevelIdx + 2}?`,
                    btnText: 'Lanjut Level Berikutnya ➔',
                    onConfirm: () => {
                      currentLevelIdx++;
                      loadLevel(currentLevelIdx);
                    }
                  });
                } else {
                  openModal({
                    icon: '🏆',
                    title: 'Selamat! Kamu Tamat!',
                    desc: 'Hebat sekali! Kamu berhasil menyelesaikan seluruh 10 Level Sokoban Grammar dengan sempurna!',
                    btnText: 'Kembali ke Menu Utama',
                    onConfirm: () => {
                      window.location.href = 'index.html';
                    }
                  });
                }
              }, 100);
              return;
            } else {
              // Jawaban SALAH -> Memantul Balik
              playSound('bounce');
              pushedCrate.x = newX;
              pushedCrate.y = newY;
              draw();
              return;
            }
          }

          history.push(JSON.stringify({ player, crates }));
          crates[crateIdx].x = crateNextX;
          crates[crateIdx].y = crateNextY;
          player.x = newX;
          player.y = newY;
          playSound('push');
        } else if (map[newY][newX] === 0) {
          history.push(JSON.stringify({ player, crates }));
          player.x = newX;
          player.y = newY;
          playSound('move');
        }

        draw();
      }

      // Listener Kontrol
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w') move(0, -1);
        if (e.key === 'ArrowDown' || e.key === 's') move(0, 1);
        if (e.key === 'ArrowLeft' || e.key === 'a') move(-1, 0);
        if (e.key === 'ArrowRight' || e.key === 'd') move(1, 0);
      });

      document.getElementById('btn-up').onclick = () => move(0, -1);
      document.getElementById('btn-down').onclick = () => move(0, 1);
      document.getElementById('btn-left').onclick = () => move(-1, 0);
      document.getElementById('btn-right').onclick = () => move(1, 0);

      document.getElementById('btn-undo').onclick = () => {
        if (history.length > 0) {
          const lastState = JSON.parse(history.pop());
          player = lastState.player;
          crates = lastState.crates;
          draw();
        }
      };

      document.getElementById('btn-reset').onclick = () => loadLevel(currentLevelIdx);
      
      document.getElementById('btn-hint').onclick = () => {
        openModal({
          icon: '💡',
          title: 'Petunjuk Soal',
          desc: levels[currentLevelIdx].hint,
          btnText: 'Saya Mengerti'
        });
      };

      loadLevel(0);
    });
  </script>
</body>
